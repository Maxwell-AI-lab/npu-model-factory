# 镜像台账（全局唯一，训练工程师的唯一入口）
# 每个镜像 tag 一条；G3 登记、G4 回填、release 晋级后即为可分发
# 首条为示例条目（DSpark v30-fixed 实战数据）

schema: v1
convention:
  versioning: "基础版 vN（①产出）；正式版 vN.x-<特性集>（班车）；紧急修复 vN.x.y（插班）"
  rule: "tag 递增永不覆盖；已验证基线永久保留可回退"

